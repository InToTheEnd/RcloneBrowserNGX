name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for package smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MinGW-w64 and Qt from MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools

      - name: Configure and build
        shell: msys2 {0}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=/ucrt64
          -DBUILD_TESTING=OFF
          && cmake --build build --parallel

      - name: Deploy Qt runtime and collect transitive DLL dependencies
        shell: msys2 {0}
        run: |
          stage=release/RcloneBrowserNG
          mkdir -p "$stage"
          cp build/build/RcloneBrowser.exe build/build/RcloneBrowserPassword.exe "$stage/"
          cp README.md CHANGELOG.md "$stage/"
          cp LICENSE "$stage/License.txt"
          if command -v windeployqt6 >/dev/null 2>&1; then
            windeployqt6 --release --compiler-runtime --no-translations "$stage/RcloneBrowser.exe" "$stage/RcloneBrowserPassword.exe"
          else
            windeployqt --release --compiler-runtime --no-translations "$stage/RcloneBrowser.exe" "$stage/RcloneBrowserPassword.exe"
          fi
          mkdir -p "$stage/platforms"
          cp /ucrt64/share/qt6/plugins/platforms/qoffscreen.dll "$stage/platforms/"
          for pass in {1..10}; do
            added=0
            while IFS= read -r -d '' binary; do
              while IFS= read -r dll; do
                [[ -n "$dll" ]] || continue
                if find "$stage" -type f -iname "$dll" -print -quit | grep -q .; then
                  continue
                fi
                dependency=$(find /ucrt64/bin -maxdepth 1 -type f -iname "$dll" -print -quit)
                if [[ -n "$dependency" ]]; then
                  cp "$dependency" "$stage/"
                  added=1
                fi
              done < <(objdump -p "$binary" | sed -n 's/^[[:space:]]*DLL Name: //p')
            done < <(find "$stage" -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
            [[ "$added" -eq 1 ]] || break
          done

      - name: Verify packaged app starts without MSYS2 on PATH
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/smoke_package.py --artifact release/RcloneBrowserNG --version $version

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create installer and portable archive
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $appDir = "RcloneBrowserNG-$version-windows-x64"
          Rename-Item release/RcloneBrowserNG $appDir
          Compress-Archive -Path "release/$appDir/*" -DestinationPath "release/$appDir.zip" -CompressionLevel Optimal
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          Push-Location scripts
          & $iscc "/dMyAppVersion=$version" '/dMyAppId={{0AF9BF43-8D44-4AFF-AE60-6CECF1BF0D31}' "/dMyAppDir=$appDir" '/dMyAppArch=x64' "/O$PWD\..\release" "/F$appDir-setup" rclone-browser-win-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Pop-Location

      - name: Upload installer and portable archive
        uses: actions/upload-artifact@v4
        with:
          name: RcloneBrowserNG-Windows
          path: |
            release/*-setup.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
